packages:
  - .

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true
overrides:
  brace-expansion@1: 1.1.21
  brace-expansion@5: 5.0.12
  deepmerge-ts: 8.0.0
  fast-uri: 3.1.8
  mysql2: 3.23.1
  source-map-js: 1.2.2
minimumReleaseAgeExclude:
  - '@types/node@22.20.2'
  - '@types/react-dom@19.3.0'
  - '@types/react@19.3.0'
  - react-dom@19.3.0
  - react@19.3.0
  - scheduler@0.28.0
  - zod@4.6.1
auditConfig:
  # Dev-only via eslint-config-next; o advisory ainda não possui a versão
  # 3.0.4 anunciada publicada no npm. Remover quando o patch existir.
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
